<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Ledger – Sign In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg:#0a0a08; --card:#111110; --border:#1e1e1a;
  --text:#f5f5f0; --muted:#3a3a35; --sub:#888880;
  --gold:#FFE500; --green:#00E676; --red:#FF3D3D;
  --gold-bg:#1a1800; --gold-text:#FFE500;
  --green-bg:#001a0d; --green-text:#00E676;
  --red-bg:#1a0000; --red-text:#FF3D3D;
}
body.light {
  --bg:#f0efe8; --card:#ffffff; --border:#e0dfd8;
  --text:#0a0a08; --muted:#c0bfb8; --sub:#666660;
  --gold:#c8b400; --green:#009944; --red:#cc2200;
  --gold-bg:#fffce0; --gold-text:#5a5000;
  --green-bg:#e0fff0; --green-text:#005528;
  --red-bg:#fff0ee; --red-text:#7a1400;
}
body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg); min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  transition:background .3s;
}

.theme-toggle {
  position:fixed; top:16px; right:20px;
  background:var(--gold); border:none; border-radius:20px;
  padding:7px 16px; cursor:pointer; font-size:12px;
  font-weight:700; color:#000;
  display:flex; align-items:center; gap:6px;
  transition:all .2s;
}
.theme-toggle:hover { background:var(--text); color:var(--bg); }

.card {
  background:var(--card); border-radius:24px;
  padding:40px 36px; width:100%; max-width:420px;
  border:1px solid var(--border);
  transition:background .3s,border-color .3s;
}
.logo { text-align:center; margin-bottom:32px; }
.logo .symbol {
  font-family:'Bebas Neue',sans-serif;
  font-size:56px; color:var(--gold); line-height:1;
  letter-spacing:2px;
}
.logo h1 {
  font-family:'Bebas Neue',sans-serif;
  color:var(--text); font-size:22px; margin-top:6px;
  letter-spacing:3px;
}
.logo p { color:var(--sub); font-size:13px; margin-top:4px; }

.tabs {
  display:flex; background:var(--bg); border-radius:12px;
  padding:4px; margin-bottom:28px;
  border:1px solid var(--border);
}
.tabs a {
  flex:1; text-align:center; padding:9px;
  border-radius:9px; text-decoration:none;
  font-size:13px; font-weight:600; color:var(--sub);
  transition:all .2s;
}
.tabs a.active { background:var(--gold); color:#000; }

label {
  display:block; color:var(--sub); font-size:11px;
  font-weight:600; margin-bottom:6px;
  letter-spacing:1px; text-transform:uppercase;
}
input[type=text], input[type=password], input[type=email] {
  width:100%; background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:12px 14px; color:var(--text);
  font-size:14px; margin-bottom:16px; outline:none;
  transition:border-color .2s; font-family:'DM Sans',sans-serif;
}
input:focus {
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,229,0,.08);
}
.btn {
  width:100%; background:var(--gold); color:#000;
  border:none; border-radius:12px; padding:14px;
  font-size:14px; font-weight:700; cursor:pointer;
  transition:all .2s; margin-top:4px;
  font-family:'DM Sans',sans-serif;
  letter-spacing:.2px;
}
.btn:hover { background:#fff; }

.alert { padding:12px 14px; border-radius:10px; font-size:13px; margin-bottom:18px; }
.alert-error   { background:var(--red-bg);   color:var(--red-text);   border:1px solid rgba(255,61,61,.2); }
.alert-success { background:var(--green-bg); color:var(--green-text); border:1px solid rgba(0,230,118,.2); }
</style>
</head>
<body>

<!-- Theme toggle -->
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light</button>

<div class="card">
  <div class="logo">
    <div class="symbol">₹</div>
    <h1>EXPENSE LEDGER</h1>
    <p>Track every rupee</p>
  </div>

  <div class="tabs">
    <a href="/login"    class="{{ 'active' if mode == 'login'    else '' }}">Sign In</a>
    <a href="/register" class="{{ 'active' if mode == 'register' else '' }}">Register</a>
  </div>

  {% if error   %}<div class="alert alert-error">❌ {{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">✅ {{ success }}</div>{% endif %}

  {% if mode == 'login' %}
  <form method="POST" action="/login">
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>
    <button class="btn" type="submit">Sign In</button>
  </form>

  {% else %}
  <form method="POST" action="/register">
    <label>Full Name</label>
    <input type="text" name="fullname" placeholder="Your full name" required>
    <label>Username</label>
    <input type="text" name="username" placeholder="Choose a username" required>
    <label>Email (optional)</label>
    <input type="email" name="email" placeholder="your@email.com">
    <label>Password</label>
    <input type="password" name="password" placeholder="Min 6 characters" required>
    <label>Confirm Password</label>
    <input type="password" name="confirm" placeholder="Repeat password" required>
    <button class="btn" type="submit">Create Account</button>
  </form>
  {% endif %}
</div>

<script>
function toggleTheme() {
  const body = document.body;
  const btn  = document.getElementById('themeBtn');
  const isLight = body.classList.toggle('light');
  btn.textContent = isLight ? '🌙 Dark' : '☀️ Light';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Apply saved theme on load
(function() {
  const saved = localStorage.getItem('theme');
  const btn   = document.getElementById('themeBtn');
  if (saved === 'light') {
    document.body.classList.add('light');
    btn.textContent = '🌙 Dark';
  } else {
    btn.textContent = '☀️ Light';
  }
})();
</script>

</body>
</html>
