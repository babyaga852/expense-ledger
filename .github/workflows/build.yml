name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install flask werkzeug openpyxl reportlab pyinstaller pillow
      - name: Build
        run: |
          source venv/bin/activate
          pyinstaller ExpenseLedger.spec
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/ExpenseLedger/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install flask werkzeug openpyxl reportlab pyinstaller pillow
      - name: Build
        run: |
          source venv/bin/activate
          pyinstaller ExpenseLedger.spec
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/ExpenseLedger.app/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          pip install flask werkzeug openpyxl reportlab pyinstaller pillow
      - name: Build
        run: |
          .\venv\Scripts\Activate
          pyinstaller ExpenseLedger.spec
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist\ExpenseLedger\